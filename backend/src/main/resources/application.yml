spring:
  application:
    name: china-kekao-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kekao}
    username: ${DB_USERNAME:kekao}
    password: ${DB_PASSWORD:kekao}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.batch_size: 30
      hibernate.order_inserts: true
      hibernate.order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    dev.kekao: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: WARN

kekao:
  auth:
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P30D}
    issuer: ${JWT_ISSUER:china-kekao}
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    rate-limit:
      capacity: ${AUTH_RL_CAPACITY:5}
      window: ${AUTH_RL_WINDOW:PT15M}
  admin:
    bootstrap-email: ${KEKAO_ADMIN_EMAIL:}
  import:
    cedict-path: ${KEKAO_IMPORT_CEDICT_PATH:}
    cedict-resource: imports/cedict.sample.txt
    hsk-list-resources:
      - imports/hsk1.txt
      - imports/hsk2.txt
      - imports/hsk3.txt
    hsk-levels: ${KEKAO_IMPORT_HSK_LEVELS:1,2,3}
    default-language: en
    max-meanings-per-hanzi: ${KEKAO_IMPORT_MAX_MEANINGS:5}
    fail-on-missing-cedict: ${KEKAO_IMPORT_FAIL_ON_MISSING:false}
