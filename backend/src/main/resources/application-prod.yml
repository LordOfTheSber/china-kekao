spring:
  jpa:
    properties:
      hibernate.jdbc.batch_size: 50
  flyway:
    clean-disabled: true

server:
  forward-headers-strategy: framework
  tomcat:
    accesslog:
      enabled: false

logging:
  level:
    root: INFO
    dev.kekao: INFO

management:
  endpoints:
    web:
      exposure:
        # Prometheus stays available even when not scraped — keeps TASK-033
        # honest without requiring a UI right now.
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
    prometheus:
      access: read_only
  metrics:
    tags:
      application: china-kekao-backend
