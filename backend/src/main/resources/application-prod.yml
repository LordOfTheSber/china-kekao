spring:
  jpa:
    properties:
      hibernate.jdbc.batch_size: 50
  flyway:
    clean-disabled: true

server:
  forward-headers-strategy: framework
  tomcat:
    accesslog:
      enabled: false

logging:
  level:
    root: INFO
    dev.kekao: INFO
  # JSON-shaped console line. We don't pull in logstash-logback-encoder so
  # that the build stays self-contained — this pattern is good enough for
  # `docker logs` shipped through Loki/Vector/Fluent Bit.
  pattern:
    console: '{"@timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%level","logger":"%logger","thread":"%thread","message":"%replace(%message){''"'',''\\"''}","exception":"%replace(%rEx){''[\r\n]+'',''\\n''}"}%n'

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
